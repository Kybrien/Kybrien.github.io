<style>
  :root { --disp:'Space Grotesk',system-ui,sans-serif; --mono:'IBM Plex Mono',monospace;
          --ac:#4CC2FF; --ink:#f4f2ee; --dim:#a9a6a0; --faint:#6d7078; --line:#1b1b1e; --panel:#08080a; }
  * { box-sizing:border-box; }
  body { margin:0; background:#050506; color:var(--ink); font-family:var(--disp); overflow:hidden; }
  a { color:inherit; text-decoration:none; }
  a:hover { color:var(--ac); }
  h1,h2,h3 { margin:0; }
  .k { font:500 11px/1 var(--mono); letter-spacing:.22em; color:var(--faint); text-transform:uppercase; }
  button { font-family:inherit; cursor:pointer; }
  .tab { padding:9px 16px; font:600 11px/1 var(--disp); letter-spacing:.16em; text-transform:uppercase;
         background:transparent; color:var(--faint); border:1px solid #1f1f23; min-height:38px; transition:.18s; }
  .tab:hover { color:var(--ink); border-color:#2d2d33; }
  .tab[aria-selected="true"] { color:#04121c; background:var(--ac); border-color:var(--ac); }
  .ctl { width:34px; height:34px; display:grid; place-items:center; background:rgba(8,8,10,.92); border:1px solid #22222a;
         color:var(--dim); font:500 13px var(--mono); transition:.18s; }
  .ctl:hover { color:var(--ac); border-color:var(--ac); }
  .type { padding:3px 7px; font:600 9px/1 var(--mono); letter-spacing:.14em; border:1px solid; }
  .t-pure { color:#8FD9A8; border-color:rgba(143,217,168,.45); }
  .t-immediate { color:#F0C674; border-color:rgba(240,198,116,.45); }
  .t-async { color:#4CC2FF; border-color:rgba(76,194,255,.45); }
  .t-service { color:#C9A8F0; border-color:rgba(201,168,240,.45); }
  #svg { display:block; width:100%; height:100%; cursor:grab; touch-action:none; }
  #svg.drag { cursor:grabbing; }
  .gnode rect { transition:fill .15s, stroke .15s; }
  .gnode { cursor:pointer; }
  .gnode text { pointer-events:none; user-select:none; }
  .row { display:grid; grid-template-columns:minmax(0,1fr) 92px; gap:14px; align-items:center; padding:11px 16px;
         border:1px solid transparent; border-bottom-color:#131316; background:transparent; text-align:left; width:100%; color:inherit; }
  .row:hover { background:rgba(76,194,255,.06); border-color:rgba(76,194,255,.3); }
  .scroll { overflow-y:auto; scrollbar-width:thin; scrollbar-color:#2a2a30 transparent; }
  .scroll::-webkit-scrollbar { width:9px; }
  .scroll::-webkit-scrollbar-thumb { background:#25252b; }
  input { font-family:var(--mono); }
  :focus-visible { outline:2px solid var(--ac); outline-offset:2px; }
  .sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
  @media (prefers-reduced-motion: reduce) { .gnode rect, #vp { transition:none !important; } }
  @media (max-width: 900px) {
    #inspector { position:fixed !important; left:0; right:0; bottom:0; top:auto !important; width:100% !important;
                 max-height:76vh; border-left:none !important; border-top:1px solid var(--line); z-index:30; }
    #brand-sub, #hdr-count, #layer-btn { display:none; }
    #search-hint { display:none; }
    .hdr-tabs { gap:6px !important; }
    .tab { padding:9px 11px; letter-spacing:.1em; }
  }
</style>

<header style="position:relative;z-index:25;display:flex;align-items:center;gap:18px;padding:0 20px;height:58px;background:rgba(5,5,6,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)">
  <a href="../index.html" class="k" style="color:#c6c3bd;flex:none">← YASP</a>
  <span style="display:flex;flex-direction:column;gap:3px;flex:none">
    <span style="font-size:14px;font-weight:600;letter-spacing:.1em">STEAM YASP</span>
    <span id="brand-sub" class="k" style="letter-spacing:.16em">Documentation · v<span id="brand-v"></span> · <span id="brand-e"></span></span>
  </span>

<main id="stage" style="position:relative;height:calc(100vh - 58px);display:flex">

  <!-- MAP -->
  <div id="view-map" style="position:relative;flex:1;min-width:0;background-image:radial-gradient(rgba(255,255,255,.05) 1px, transparent 1px);background-size:34px 34px">
    <svg id="svg" role="application" aria-label="Steam YASP API map"><g id="vp"><g id="links" fill="none"></g><g id="nodes"></g></g></svg>
    <div style="position:absolute;left:18px;top:18px;max-width:230px;display:flex;flex-direction:column;gap:7px;pointer-events:none;padding:11px 13px;background:rgba(5,5,6,.9);border:1px solid #16161a">
      <span class="k" style="letter-spacing:.2em;color:#c6c3bd">Steam YASP API Map</span>

    </div>

  <!-- REFERENCE -->

  <!-- INSPECTOR -->

</main>

<!-- SEARCH -->
<div id="search-ov" style="display:none;position:fixed;inset:0;z-index:60;background:rgba(3,3,4,.82);backdrop-filter:blur(6px);padding:11vh 20px 20px">
  <div style="max-width:760px;margin:0 auto;background:#08080a;border:1px solid #23232a;display:flex;flex-direction:column;max-height:74vh">
    <div style="display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid #17171a">
      <span class="k" style="color:var(--ac)">/</span>
      <input id="search-in" placeholder="Search 184 nodes — name, service, category, description" aria-label="Search the YASP API"
             style="flex:1;background:transparent;border:none;outline:none;color:var(--ink);font-size:16px;letter-spacing:.02em">
      <span class="k" id="search-n"></span>
    </div>
    <div id="search-res" class="scroll" style="overflow-y:auto"></div>
  </div>
</div>
<span class="sr" id="live" aria-live="polite"></span>

<script src="../yasp-api.js"></script>
<script>
(function () {
var D = window.YASP_API, NS = 'http://www.w3.org/2000/svg';
var $ = function (id) { return document.getElementById(id); };
var esc = function (s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); };

/* ── flat index (single source: yasp-api.js) ───────────────────── */
var INDEX = [];
D.services.forEach(function (s) {
  s.cats.forEach(function (c) {
    c.nodes.forEach(function (n) {
      INDEX.push({ node: n, s: s, c: c, path: s.id + '/' + c.id + '/' + n.slug, layer: n.layer || 'primary',
                   hay: (n.name + ' ' + s.name + ' ' + c.name + ' ' + n.desc + ' ' + n.type + ' ' + (n.layer || 'primary')).toLowerCase() });
    });
  });
});
var byPath = {}; INDEX.forEach(function (e) { byPath[e.path] = e; });
$('brand-v').textContent = D.version; $('brand-e').textContent = D.engine;
$('search-in').placeholder = 'Search ' + INDEX.length + ' nodes — name, service, category, description';

/* ── state ─────────────────────────────────────────────────────── */
var st = { mode: 'map', svc: {}, cat: {}, sel: null, ex: null, tx: 0, ty: 0, k: 1, layer: 'primary' };

/* layer filter — Primary is the default view; Helpers/Advanced are opt-in */
function vis(nodes) {
  if (st.layer === 'all') return nodes;
  return nodes.filter(function (n) { return (n.layer || 'primary') === 'primary'; });
}
function svcCount(s) { return st.layer === 'all' ? s.total : s.count; }
function syncCount() {
  var n = 0;
  D.services.forEach(function (s) { n += svcCount(s); });
  $('hdr-count').textContent = st.layer === 'all' ? n + ' · all layers' : (n + 8) + ' nodes';
  $('layer-btn').textContent = st.layer === 'all' ? 'ALL LAYERS' : 'PRIMARY';
  $('layer-btn').setAttribute('aria-selected', st.layer === 'all');
}

/* ══ GRAPH ═════════════════════════════════════════════════════ */
var NW = 210, NH = 34, GAP = 9, COL = [0, 268, 536, 804];
var layout = { nodes: [], links: [], h: 0 };

function buildLayout() {
  var nodes = [], links = [], y = 0;
  function place(item, d, h) { item.x = COL[d]; item.y = y + h / 2; nodes.push(item); }
  var rootChildren = [];
  D.services.forEach(function (s) {
    var sTop = y, kids = [];
    if (st.svc[s.id]) {
      s.cats.forEach(function (c) {
        var vn = vis(c.nodes);
        if (!vn.length) return;
        var cTop = y, cKids = [];
        if (st.cat[s.id + '/' + c.id]) {
          vn.forEach(function (n) {
            var it = { kind: 'node', id: s.id + '/' + c.id + '/' + n.slug, label: n.name, type: n.type, layer: n.layer || 'primary', intent: !!n.intent, d: 3, y: y + NH / 2, x: COL[3] };
            nodes.push(it); cKids.push(it); y += NH + GAP;
          });
          y -= (NH + GAP); y += NH + GAP;
        } else { y += NH + GAP; }
        var cy = cKids.length ? (cKids[0].y + cKids[cKids.length - 1].y) / 2 : cTop + NH / 2;
        var cit = { kind: 'cat', id: s.id + '/' + c.id, label: c.name, count: vn.length, d: 2, x: COL[2], y: cy, open: !!st.cat[s.id + '/' + c.id] };
        nodes.push(cit); kids.push(cit);
        cKids.forEach(function (k) { links.push([cit, k]); });
        if (cKids.length) y += GAP * 1.2;
      });
    } else { y += NH + GAP; }
    var sy = kids.length ? (kids[0].y + kids[kids.length - 1].y) / 2 : sTop + NH / 2;
    var sit = { kind: 'svc', id: s.id, label: s.name, count: svcCount(s), d: 1, x: COL[1], y: sy, open: !!st.svc[s.id] };
    nodes.push(sit); rootChildren.push(sit);
    kids.forEach(function (k) { links.push([sit, k]); });
    y += GAP * 2.2;
  });
  var root = { kind: 'root', id: '', label: 'Get Steam YASP', d: 0, x: COL[0],
               y: (rootChildren[0].y + rootChildren[rootChildren.length - 1].y) / 2 };
  nodes.push(root); rootChildren.forEach(function (c) { links.push([root, c]); });
  layout = { nodes: nodes, links: links, h: y };
}

function colorFor(it) {
  if (it.kind === 'root') return ['rgba(76,194,255,.14)', '#4CC2FF'];
  if (it.kind === 'svc') return it.open ? ['rgba(201,168,240,.12)', '#C9A8F0'] : ['#0b0d11', '#2c2f36'];
  if (it.kind === 'cat') return it.open ? ['rgba(76,194,255,.08)', '#3a6a86'] : ['#0b0d11', '#24262c'];
  var m = { pure: '#8FD9A8', immediate: '#F0C674', async: '#4CC2FF', service: '#C9A8F0' };
  if (st.sel === it.id) return ['rgba(76,194,255,.2)', '#4CC2FF'];
  if (it.layer && it.layer !== 'primary') return ['#08090b', '#1e2025'];
  if (it.intent) return ['rgba(76,194,255,.07)', 'rgba(76,194,255,.55)'];
  return ['#0b0d11', (m[it.type] || '#24262c') + '55'];
}

function drawGraph() {
  buildLayout();
  var L = $('links'), N = $('nodes');
  L.textContent = ''; N.textContent = '';
  var onPath = {};
  if (st.sel) { var p = st.sel.split('/'); onPath[''] = 1; onPath[p[0]] = 1; onPath[p[0] + '/' + p[1]] = 1; onPath[st.sel] = 1; }
  layout.links.forEach(function (ln) {
    var a = ln[0], b = ln[1], x1 = a.x + NW, y1 = a.y, x2 = b.x, y2 = b.y, mx = (x1 + x2) / 2;
    var hot = onPath[a.id] && onPath[b.id];
    var path = document.createElementNS(NS, 'path');
    path.setAttribute('d', 'M' + x1 + ' ' + y1 + ' C' + mx + ' ' + y1 + ' ' + mx + ' ' + y2 + ' ' + x2 + ' ' + y2);
    path.setAttribute('stroke', hot ? '#4CC2FF' : '#1f2228');
    path.setAttribute('stroke-width', hot ? 1.6 : 1);
    L.appendChild(path);
  });
  layout.nodes.forEach(function (it) {
    var g = document.createElementNS(NS, 'g'); g.setAttribute('class', 'gnode');
    var c = colorFor(it);
    var r = document.createElementNS(NS, 'rect');
    r.setAttribute('x', it.x); r.setAttribute('y', it.y - NH / 2); r.setAttribute('width', NW); r.setAttribute('height', NH);
    r.setAttribute('fill', c[0]); r.setAttribute('stroke', c[1]);
    g.appendChild(r);
    var t = document.createElementNS(NS, 'text');
    t.setAttribute('x', it.x + 13); t.setAttribute('y', it.y + 5); t.setAttribute('fill', it.kind !== 'node' || st.sel === it.id || it.intent ? '#f4f2ee' : (it.layer !== 'primary' ? '#6d7078' : '#dcdad5'));
    t.setAttribute('style', 'font:' + (it.kind === 'node' ? (it.intent ? '600 12px var(--mono)' : '500 12px var(--mono)') : '600 13px var(--disp)') + ';letter-spacing:.04em');
    t.textContent = it.label.length > 26 ? it.label.slice(0, 25) + '…' : it.label;
    g.appendChild(t);
    if (it.count) {
      var b = document.createElementNS(NS, 'text');
      b.setAttribute('x', it.x + NW - 12); b.setAttribute('y', it.y + 5); b.setAttribute('text-anchor', 'end');
      b.setAttribute('fill', '#6d7078'); b.setAttribute('style', 'font:500 10px var(--mono);letter-spacing:.1em');
      b.textContent = (it.open ? '−' : '+') + ' ' + it.count;
      g.appendChild(b);
    }
    if (it.kind === 'node') {
      var m = { pure: '#8FD9A8', immediate: '#F0C674', async: '#4CC2FF', service: '#C9A8F0' };
      var dot = document.createElementNS(NS, 'rect');
      dot.setAttribute('x', it.x); dot.setAttribute('y', it.y - NH / 2); dot.setAttribute('width', 3); dot.setAttribute('height', NH);
      dot.setAttribute('fill', m[it.type] || '#24262c'); g.appendChild(dot);
    }
    var title = document.createElementNS(NS, 'title'); title.textContent = it.label; g.appendChild(title);
    g.__item = it;
    N.appendChild(g);
  });
  applyTransform();
}

function expandBranch(sid) {
  var s = D.services.filter(function (x) { return x.id === sid; })[0];
  if (!s) return;
  st.svc[sid] = 1;
  s.cats.forEach(function (c) { if (vis(c.nodes).length) st.cat[sid + '/' + c.id] = 1; });
}
function collapseBranch(sid) {
  delete st.svc[sid];
  Object.keys(st.cat).forEach(function (k) { if (k.split('/')[0] === sid) delete st.cat[k]; });
}
/* graph clicks mutate state directly and never move the camera;
   the hash is updated quietly so the router doesn't rebuild/refit the view */
function dropSel(prefix) {
  if (st.sel && (st.sel === prefix || st.sel.indexOf(prefix + '/') === 0)) { st.sel = null; closeInspector(); }
}
function onGraphClick(it) {
  if (it.kind === 'root') {
    st.svc = {}; st.cat = {}; st.sel = null; closeInspector();
    drawGraph(); quietHash('');
    return;
  }
  if (it.kind === 'svc') {
    if (st.svc[it.id]) { collapseBranch(it.id); dropSel(it.id); }
    else expandBranch(it.id);
    drawGraph(); quietHash(st.svc[it.id] ? it.id : '');
    return;
  }
  if (it.kind === 'cat') {
    if (st.cat[it.id]) { delete st.cat[it.id]; dropSel(it.id); }
    else st.cat[it.id] = 1;
    drawGraph(); quietHash(st.cat[it.id] ? it.id : it.id.split('/')[0]);
    return;
  }
  st.sel = it.id; drawGraph(); showInspector(it.id); quietHash(it.id);
}

function applyTransform() { $('vp').setAttribute('transform', 'translate(' + st.tx + ',' + st.ty + ') scale(' + st.k + ')'); }

function bbox() {
  var minX = 1e9, minY = 1e9, maxX = -1e9, maxY = -1e9;
  layout.nodes.forEach(function (n) {
    minX = Math.min(minX, n.x); maxX = Math.max(maxX, n.x + NW);
    minY = Math.min(minY, n.y - NH / 2); maxY = Math.max(maxY, n.y + NH / 2);
  });
  return { x: minX, y: minY, w: maxX - minX, h: maxY - minY };
}
function fit(pad) {
  pad = pad || 60;
  var r = $('view-map').getBoundingClientRect(), b = bbox();
  st.k = Math.min(1.1, Math.min((r.width - pad * 2) / b.w, (r.height - pad * 2) / b.h));
  st.tx = (r.width - b.w * st.k) / 2 - b.x * st.k;
  st.ty = (r.height - b.h * st.k) / 2 - b.y * st.k;
  applyTransform();
}
function fitBranch(prefix, pad) {
  pad = pad || 56;
  var sel = layout.nodes.filter(function (n) {
    return n.id === prefix || n.id.indexOf(prefix + '/') === 0;
  });
  if (!sel.length) return fit();
  var minX = 1e9, minY = 1e9, maxX = -1e9, maxY = -1e9;
  sel.forEach(function (n) {
    minX = Math.min(minX, n.x); maxX = Math.max(maxX, n.x + NW);
    minY = Math.min(minY, n.y - NH / 2); maxY = Math.max(maxY, n.y + NH / 2);
  });
  var r = $('view-map').getBoundingClientRect(), w = maxX - minX, hgt = maxY - minY;
  // never zoom below a readable scale — pan instead of shrinking a 45-node branch
  st.k = Math.max(.62, Math.min(1, Math.min((r.width - pad * 2) / w, (r.height - pad * 2) / hgt)));
  st.tx = w * st.k + pad * 2 < r.width ? (r.width - w * st.k) / 2 - minX * st.k : pad - minX * st.k;
  st.ty = hgt * st.k + pad * 2 < r.height ? (r.height - hgt * st.k) / 2 - minY * st.k : pad - minY * st.k;
  applyTransform();
}
function focusNode(id) {
  var it = layout.nodes.filter(function (n) { return n.id === id; })[0];
  if (!it) return;
  var r = $('view-map').getBoundingClientRect();
  st.k = Math.max(st.k, .8);
  st.tx = r.width * (r.width > 900 ? .3 : .5) - (it.x + NW / 2) * st.k;
  st.ty = r.height / 2 - it.y * st.k;
  applyTransform();
}
function zoomAt(f, cx, cy) {
  var r = $('svg').getBoundingClientRect(), k2 = Math.max(.18, Math.min(2.4, st.k * f));
  var px = (cx - r.left - st.tx) / st.k, py = (cy - r.top - st.ty) / st.k;

$('search-btn').onclick = openSearch;
$('search-in').oninput = function (e) { runSearch(e.target.value); };
$('search-ov').onclick = function (e) { if (e.target === $('search-ov')) closeSearch(); };
document.addEventListener('keydown', function (e) {
  var typing = /^(INPUT|TEXTAREA)$/.test((e.target.tagName || ''));
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); searchOpen ? closeSearch() : openSearch(); return; }
  if (e.key === '/' && !typing && !searchOpen) { e.preventDefault(); openSearch(); return; }
  if (!searchOpen) { if (e.key === 'Escape') closeInspector(); return; }
  if (e.key === 'Escape') { closeSearch(); return; }
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    cursor = Math.max(0, Math.min(results.length - 1, cursor + (e.key === 'ArrowDown' ? 1 : -1)));
    renderResults();
    var el = $('search-res').querySelector('[data-i="' + cursor + '"]');
    if (el) el.scrollIntoViewIfNeeded ? el.scrollIntoViewIfNeeded() : null;
  }
  if (e.key === 'Enter' && results[cursor]) { closeSearch(); revealLayerFor(results[cursor].path); setHash(results[cursor].path); }
});

/* ══ ROUTING ══════════════════════════════════════════════════ */
function setHash(h) { if (location.hash.slice(1) === h) route(); else location.hash = h; }
var quiet = false;
function quietHash(h) { if (location.hash.slice(1) === h) return; quiet = true; location.hash = h; }
function setMode(m) {
  st.mode = m;
  $('view-map').style.display = m === 'map' ? 'block' : 'none';
  $('view-ref').style.display = m === 'reference' ? 'block' : 'none';
  $('view-ex').style.display = m === 'examples' ? 'block' : 'none';
  $('tab-map').setAttribute('aria-selected', m === 'map');
  $('tab-ref').setAttribute('aria-selected', m === 'reference');
  $('tab-ex').setAttribute('aria-selected', m === 'examples');
  if (m !== 'map') closeInspector();
}
function route() {
  var h = decodeURIComponent(location.hash.slice(1));
  var parts = h.split('/').filter(Boolean);
  if (parts[0] === 'reference') {
    setMode('reference');
    var t = parts[1] && document.getElementById('ref-' + parts[1]);
    $('view-ref').scrollTop = t ? t.offsetTop - 20 : 0;
    return;
  }
  if (parts[0] === 'examples') {
    setMode('examples');
    var e2 = parts[1] && document.getElementById('ex-' + parts[1]);
    $('view-ex').scrollTop = e2 ? e2.offsetTop - 20 : 0;
    return;
  }
  setMode('map');
  var svc = D.services.filter(function (s) { return s.id === parts[0]; })[0];
  st.sel = null;
  if (!svc) { st.svc = {}; st.cat = {}; closeInspector(); drawGraph(); fit(); return; }
  var cat = parts[1] && svc.cats.filter(function (c) { return c.id === parts[1]; })[0];
  if (cat) st.svc[svc.id] = 1; else expandBranch(svc.id);
  if (cat) st.cat[svc.id + '/' + cat.id] = 1;
  if (cat && parts[2]) {
    var path = svc.id + '/' + cat.id + '/' + parts[2];
    revealLayerFor(path);
    if (byPath[path]) { st.sel = path; drawGraph(); showInspector(path); focusNode(path); return; }
  }
  closeInspector();
  drawGraph();
  if (cat) fitBranch(svc.id + '/' + cat.id); else fitBranch(svc.id);
}
$('tab-map').onclick = function () { setHash(''); };
$('tab-ref').onclick = function () { setHash('reference'); };
$('tab-ex').onclick = function () { setHash('examples'); };
window.addEventListener('hashchange', function () { if (quiet) { quiet = false; return; } route(); });
window.addEventListener('resize', function () { if (st.mode === 'map' && !st.sel) fit(); });

syncCount(); buildRef(); buildEx(); drawGraph();
if (!location.hash && window.innerWidth < 760) location.hash = 'reference';
route();
if (st.mode === 'map' && !st.sel) fit();
})();
</script>
